- name: Disabling the default nginx module
  ansible.builtin.shell: dnf module disable nginx -y

- name: Enabling the default nginx module
  ansible.builtin.shell: dnf module enable nginx:1.24 -y

- name: Installing Nginx 
  ansible.builtin.package:
    name: nginx 
    state: present

- name: Cleanup of the default Nginx content
  ansible.builtin.file:
    path: /usr/share/nginx/html
    state: absent

- name: Preparing the Nginx directory
  ansible.builtin.file:
    path: /usr/share/nginx/html
    state: directory

- name: Download and extract frontend
  ansible.builtin.unarchive:
    src: "{{ url }}"
    dest: /usr/share/nginx/html
    remote_src: yes           # If yes, download from the URL mentioned in src machine, if no, copy from local machine to remote machine

- name: Starting Nginx service
  ansible.builtin.service:
    name: nginx
    enabled: yes
    state: restarted

- name: Configuring the hostName
  ansible.builtin.shell: set-hostname frontend-{{ env }}