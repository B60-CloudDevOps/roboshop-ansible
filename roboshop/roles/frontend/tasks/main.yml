- name: Disabling the default nginx version 
  ansible.builtin.dnf:
    name: '@nginx'

- name: Enabling the default nginx version 
  ansible.builtin.dnf:
    name: nginx
    state: present
    module_enable:
      - nginx:1.24

- name: Installing Nginx 
  ansible.builtin.package:
    name: nginx 
    state: present

- name: Starting Nginx service
  ansible.builtin.service:
    name: nginx
    enabled: yes
    state: started