- name: Set Prompt
  ansible.builtin.shell: set-hostname github-runner

- name: Add github runner user
  ansible.builtin.user:
    name: github-runner
    home: /github-runner

- name: Download runner software
  ansible.builtin.unarchive:
    src: https://github.com/actions/runner/releases/download/v{{ runner_version }}/actions-runner-linux-x64-{{ runner_version }}.tar.gz
    dest: /github-runner
    owner: github-runner
    group: github-runner
    remote_src: yes

- name: Install libicu
  ansible.builtin.dnf:
    name: libicu
    state: installed

- name: Configure runner
  ansible.builtin.shell: ./config.sh --url https://github.com/{{ github_org_name }} --token "{{ secrets.runner_token }}" --runnergroup Default --name github-runner --labels self-hosted --work _work --replace
  args:
    chdir: /github-runner
  become_user: github-runner
  ignore_errors: true


- name: Copy Service
  ansible.builtin.template:
    src: github-runner.service
    dest: /etc/systemd/system/github-runner.service

- name: Start Runner Service
  ansible.builtin.systemd_service:
    name: github-runner
    state: restarted
    enabled: yes

- name: Download Terraform Repo
  ansible.builtin.get_url:
    url: https://rpm.releases.hashicorp.com/RHEL/hashicorp.repo
    dest: /etc/yum.repos.d/hashicorp.repo

- name: Install Terraform
  ansible.builtin.dnf:
    name: terraform
    state: installed

- name: Install App Packages
  ansible.builtin.dnf:
    name:
      - nodejs
      - maven
      - npm
