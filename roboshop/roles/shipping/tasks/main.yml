- name: Installing "{{ packageName }}" 
  ansible.builtin.package:
    name: "{{ packageName }}" 
    state: present

- name: creating appuser for {{ component }} service
  ansible.builtin.user:
    name: "{{ appUser }}"
    create_home: yes

- name: Cleanup of the {{ appDirectory }} content
  ansible.builtin.file:
    path: "{{ appDirectory }}"
    state: absent

- name: Creating app directory for {{ component }} service
  ansible.builtin.file:
    path: "{{ appDirectory }}"
    state: directory

- name: Download and extracting the {{ component }} service
  ansible.builtin.unarchive:
    src: "{{ url }}"
    dest: "{{ appDirectory }}"
    remote_src: yes           # If yes, download from the URL mentioned in src machine, if no, copy from local machine to remote machine

- name: Generating artifact dependencies for {{ component }} service
  ansible.builtin.shell: mvn clean package && mv target/{{ component }}-1.0.jar {{ component }}.jar 
  args:
    chdir: "{{ appDirectory }}"

- name: Configuring the {{ component }} service
  ansible.builtin.template:
    src: "{{ component }}.service"
    dest: "/etc/systemd/system/{{ component }}.service"

- name: Installing mysqlShell
  ansible.builtin.package:
    name: mysql
    state: present

- name: Injecting Schema for {{ component }} service
  loop: "{{ schema }}"
  ansible.builtin.shell: mysql -h mysql-{{ env }}.robotshop.fun -uroot -pRoboShop@1 < /app/db/{{ item }}

- name: Starting {{ component }} service
  ansible.builtin.service:
    name: "{{ component }}"
    enabled: yes
    state: restarted
    daemon_reload: yes

- name: Configuring the hostName
  ansible.builtin.shell: set-hostname {{ component }}-{{ env }}