- name: Installing the packages for {{ component }} service
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop: "{{ packages }}"

- name: creating appuser for {{ component }} service
  ansible.builtin.user:
    name: "{{ appUser }}"
    create_home: yes

- name: Cleanup of the {{ appDirectory }} content
  ansible.builtin.file:
    path: "{{ appDirectory }}"
    state: absent

- name: Creating app directory for {{ component }} service
  ansible.builtin.file:
    path: "{{ appDirectory }}"
    state: directory

- name: Download and extracting the {{ component }} service
  ansible.builtin.unarchive:
    src: "{{ url }}"
    dest: "{{ appDirectory }}"
    remote_src: yes           # If yes, download from the URL mentioned in src machine, if no, copy from local machine to remote machine

- name: Install specified python requirements
  ansible.builtin.pip:
    requirements: "{{ appDirectory }}/requirements.txt"
  executable: pip3.11

- name: Configuring the {{ component }} service
  ansible.builtin.template:
    src: "{{ component }}.service"
    dest: "/etc/systemd/system/{{ component }}.service"

- name: Starting {{ component }} service
  ansible.builtin.service:
    name: "{{ component }}"
    enabled: yes
    state: restarted
    daemon_reload: yes

- name: Configuring the hostName
  ansible.builtin.shell: set-hostname {{ component }}-{{ env }}