- name: Installing "{{ packageName }}" 
  ansible.builtin.package:
    name: "{{ packageName }}" 
    state: present

- name: Starting "{{ packageName }}" service
  ansible.builtin.service:
    name: mysqld
    enabled: yes
    state: restarted

- name: Configuring the root pasword
  ansible.builtin.shell: mysql_secure_installation --set-root-pass RoboShop@1

# Clones the repo 
- name: Clone on the remote host - {{ component }} service
  ansible.builtin.git:
    repo: 'https://github.com/B60-CloudDevOps/shipping.git'
    dest: /tmp/checkout
    version: main

- name: Injecting Schema for {{ component }} service
  loop: "{{ schema }}"
  ansible.builtin.shell: mysql -h mysql-{{ env }}.robotshop.fun -uroot -p{{ secrets.mysql_pass }} < /tmp/checkout/db/{{ item }}  

- name: Configuring the hostName
  ansible.builtin.shell: set-hostname {{ component }}-{{ env }}